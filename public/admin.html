<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OM APP STORE · Admin</title><link rel="stylesheet" href="style.css"><style>.panel{max-width:760px;margin:35px auto;background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:25px}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}.field textarea{min-height:110px}.btn{border:0;background:#111827;color:#fff;padding:13px 18px;border-radius:10px;font-weight:800}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.item{padding:14px 0;border-bottom:1px solid #eee}</style></head><body><header><div class="brand"><div class="logo">OM</div><div><b>OM APP STORE</b><small>Admin panel</small></div></div><a class="admin" href="/">Store</a></header><main><div class="panel"><h2>Upload App</h2><p>APK, icon aur details add karke publish karo.</p><div class="field"><label>Admin Key</label><input id="key" type="password"></div><div class="field"><label>App Name *</label><input id="name"></div><div class="field"><label>Version</label><input id="version" value="1.0.0"></div><div class="field"><label>Category</label><input id="category" value="Apps"></div><div class="field"><label>Description</label><textarea id="description"></textarea></div><div class="field"><label>APK *</label><input id="apk" type="file" accept=".apk"></div><div class="field"><label>App Icon</label><input id="icon" type="file" accept="image/png,image/jpeg,image/webp"></div><button class="btn" onclick="publish()">Publish App</button><p id="msg"></p></div><div class="panel"><div class="row"><h2>Published Apps</h2><button class="btn" onclick="load()">Refresh</button></div><div id="list"></div></div></main><script>async function load(){const a=await fetch('/api/apps').then(r=>r.json());document.querySelector('#list').innerHTML=a.map(x=>`<div class="item"><div class="row"><div><b>${x.name}</b><br><small>v${x.version} · ${x.category}</small></div><button class="btn danger" onclick="del(${x.id})">Delete</button></div></div>`).join('')||'<p>No apps.</p>'}async function publish(){const f=new FormData();['name','version','category','description'].forEach(id=>f.append(id,document.getElementById(id).value));f.append('apk',document.getElementById('apk').files[0]);if(document.getElementById('icon').files[0])f.append('icon',document.getElementById('icon').files[0]);const r=await fetch('/api/apps',{method:'POST',headers:{'x-admin-key':document.getElementById('key').value},body:f}),j=await r.json();document.querySelector('#msg').textContent=j.ok?'✅ Published!':'❌ '+j.error;if(j.ok)load()}async function del(id){if(!confirm('Delete this app?'))return;await fetch('/api/apps/'+id,{method:'DELETE',headers:{'x-admin-key':document.getElementById('key').value}});load()}load();</script></body></html>
